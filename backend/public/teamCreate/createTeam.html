<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Team</title>
    <link rel="stylesheet" href="/teamCreate/createTeam.css">
</head>
<body>

<div class="mainBody">

    <!-- HEADER -->
    <div class="header">
        <h1>Create Your Team</h1>
    </div>

    <div class="saveBtn"> 
        <button class="saveButton"> Save and Next</button> 
    </div>

    <!-- MAIN LAYOUT -->
    <div class="bodyRow">

        <!-- LEFT SIDE -->
        <div class="leftSide">

            <div class="content">

                <!-- JERSEY SECTION -->
                <div class="kitHeader">Pick Your Jersey</div>

                <div class="imageContainer">
                    <img src="/Teamkits/Bjersey.png" class="blue">
                    <img src="/Teamkits/BLjersey.png" class="black">
                    <img src="/Teamkits/Wjersey.png" class="white">
                    <img src="/Teamkits/Gjersey.png" class="green">
                </div>

                <!-- SHORTS SECTION -->
                <div class="kitHeader">Pick Your Shorts</div>

                <div class="shortsContainer">
                    <img src="/Teamshorts/Gshorts.png" class="green_shorts">
                    <img src="/Teamshorts/Wshorts.png" class="white_shorts">
                    <img src="/Teamshorts/BLshorts.png" class="black_shorts">
                    <img src="/Teamshorts/Bshorts.png" class="blue_shorts">
                </div>

                <!-- TEAM NAME INPUT -->
                <div class="teamName">
                    <p>Team Name</p>
                    <input type="text" class="teamIn">
                    <button class="entBtn">Enter</button>
                    <div class="emptydiv"></div>
                </div>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="rightSide">
            <h1>Team Information</h1>
        </div>

    </div>

</div>

<script src="/teamCreate/createTeam.js"></script>
</body>
</html>
